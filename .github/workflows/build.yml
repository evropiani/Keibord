name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**', '.github/workflows/testflight.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v1.0.0); leave empty for a plain build"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Core unit tests
        run: swift test --package-path Core

  ios:
    needs: core-tests
    # Private repos bill macOS minutes at 10x — keep this job lean.
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Keibord.xcodeproj -scheme Keibord -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD" || true
          if ! grep -q "BUILD SUCCEEDED" build.log; then
            echo "::group::Errors"; grep -E "error:|fatal error" build.log | sort -u | head -150; echo "::endgroup::"
            exit 1
          fi
      - name: Package IPA
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Keibord.app Payload/
          # Ad-hoc sign with entitlements so sideloading tools register the app group.
          sed 's/$(KEIBORD_BUNDLE_ID)/com.keibord.app/g' Keyboard/KeibordKeyboard.entitlements > keyboard.entitlements
          sed 's/$(KEIBORD_BUNDLE_ID)/com.keibord.app/g' App/Keibord.entitlements > app.entitlements
          codesign -f -s - --entitlements keyboard.entitlements Payload/Keibord.app/PlugIns/KeibordKeyboard.appex
          codesign -f -s - --entitlements app.entitlements Payload/Keibord.app
          codesign -d --entitlements - Payload/Keibord.app/PlugIns/KeibordKeyboard.appex
          zip -qry Keibord.ipa Payload
          ls -lh Keibord.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Keibord-ipa
          path: Keibord.ipa
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release create "$TAG" Keibord.ipa --target "$GITHUB_SHA" --title "Keibord $TAG" --notes-file docs/RELEASE_NOTES.md
      - name: Update the store source gist
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          BUILD=$(sed -n 's/^ *CURRENT_PROJECT_VERSION: "\(.*\)"/\1/p' project.yml | head -1)
          python3 tools/update_store_source.py --version "${TAG#v}" --build "$BUILD" --size "$(stat -f%z Keibord.ipa)" \
            --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --notes-file docs/RELEASE_NOTES.md --upload
