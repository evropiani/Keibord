name: Update store gist

# Uploads distribution/keibord-source.json (as committed) to the old store source gist, by hand only.
# Releases no longer touch the gist: the owner keeps their own store source up to date with a script.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload the store source
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: python3 tools/update_store_source.py --upload
