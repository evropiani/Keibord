name: Keibord
options:
  bundleIdPrefix: com.keibord
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.25"
    CURRENT_PROJECT_VERSION: "26"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    # Change via the repository variable KEIBORD_BUNDLE_ID (TestFlight builds) if com.keibord.app is taken.
    KEIBORD_BUNDLE_ID: com.keibord.app
packages:
  KeibordCore:
    path: Core
targets:
  Keibord:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: Shared
      - path: App/Assets.xcassets
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      # One keyboard per language (Settings › Keyboards lists them separately); all share the framework.
      - target: KeibordKeyboard
      - target: KeibordKeyboardEN
      - target: KeibordKeyboardSQ
      - target: KeibordKeyboardIT
      - target: KeibordKeyboardKit
        embed: true
        link: false
      - package: KeibordCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Keibord
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        KeibordAppGroup: group.$(KEIBORD_BUNDLE_ID)
    entitlements:
      path: App/Keibord.entitlements
      properties:
        com.apple.security.application-groups: [group.$(KEIBORD_BUNDLE_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KEIBORD_BUNDLE_ID)
        PRODUCT_NAME: Keibord
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: []
  # Keibord Deutsch keeps the original keyboard's bundle id, so iOS keeps it enabled (with Full Access).
  KeibordKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard/Entry
      - path: Keyboard/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: KeibordKeyboardKit
        embed: false
    info:
      path: Keyboard/Languages/de/Info.plist
      properties:
        CFBundleDisplayName: Keibord Deutsch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: KeibordKeyboardKit.KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: de-AT
            RequestsOpenAccess: true
        KeibordAppGroup: group.$(KEIBORD_BUNDLE_ID)
        KeibordKeyboardLanguage: de
    entitlements:
      path: Keyboard/KeibordKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.$(KEIBORD_BUNDLE_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KEIBORD_BUNDLE_ID).keyboard
        PRODUCT_NAME: KeibordKeyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  KeibordKeyboardEN:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard/Entry
      - path: Keyboard/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: KeibordKeyboardKit
        embed: false
    info:
      path: Keyboard/Languages/en/Info.plist
      properties:
        CFBundleDisplayName: Keibord English
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: KeibordKeyboardKit.KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-GB
            RequestsOpenAccess: true
        KeibordAppGroup: group.$(KEIBORD_BUNDLE_ID)
        KeibordKeyboardLanguage: en
    entitlements:
      path: Keyboard/KeibordKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.$(KEIBORD_BUNDLE_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KEIBORD_BUNDLE_ID).keyboard.en
        PRODUCT_NAME: KeibordKeyboardEN
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  KeibordKeyboardSQ:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard/Entry
      - path: Keyboard/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: KeibordKeyboardKit
        embed: false
    info:
      path: Keyboard/Languages/sq/Info.plist
      properties:
        CFBundleDisplayName: Keibord Shqip
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: KeibordKeyboardKit.KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: sq-AL
            RequestsOpenAccess: true
        KeibordAppGroup: group.$(KEIBORD_BUNDLE_ID)
        KeibordKeyboardLanguage: sq
    entitlements:
      path: Keyboard/KeibordKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.$(KEIBORD_BUNDLE_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KEIBORD_BUNDLE_ID).keyboard.sq
        PRODUCT_NAME: KeibordKeyboardSQ
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  KeibordKeyboardIT:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard/Entry
      - path: Keyboard/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: KeibordKeyboardKit
        embed: false
    info:
      path: Keyboard/Languages/it/Info.plist
      properties:
        CFBundleDisplayName: Keibord Italiano
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: KeibordKeyboardKit.KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: it-IT
            RequestsOpenAccess: true
        KeibordAppGroup: group.$(KEIBORD_BUNDLE_ID)
        KeibordKeyboardLanguage: it
    entitlements:
      path: Keyboard/KeibordKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.$(KEIBORD_BUNDLE_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KEIBORD_BUNDLE_ID).keyboard.it
        PRODUCT_NAME: KeibordKeyboardIT
        APPLICATION_EXTENSION_API_ONLY: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
  # The keyboard's code, dictionaries and emoji data, once for all language keyboards.
  KeibordKeyboardKit:
    type: framework
    platform: iOS
    sources:
      - path: Keyboard/Sources
      - path: Shared
      - path: Keyboard/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Dictionaries
        type: folder
        buildPhase: resources
      - path: Resources/Emoji
        type: folder
        buildPhase: resources
    dependencies:
      - package: KeibordCore
    info:
      path: Keyboard/Kit/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KEIBORD_BUNDLE_ID).keyboardkit
        PRODUCT_NAME: KeibordKeyboardKit
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @loader_path/Frameworks"
