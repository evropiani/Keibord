name: Keibord
options:
  bundleIdPrefix: com.keibord
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "4"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    # Change via the repository variable KEIBORD_BUNDLE_ID (TestFlight builds) if com.keibord.app is taken.
    KEIBORD_BUNDLE_ID: com.keibord.app
packages:
  KeibordCore:
    path: Core
targets:
  Keibord:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: Shared
      - path: App/Assets.xcassets
      - path: App/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: KeibordKeyboard
      - package: KeibordCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Keibord
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        KeibordAppGroup: group.$(KEIBORD_BUNDLE_ID)
    entitlements:
      path: App/Keibord.entitlements
      properties:
        com.apple.security.application-groups: [group.$(KEIBORD_BUNDLE_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KEIBORD_BUNDLE_ID)
        PRODUCT_NAME: Keibord
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: []
  KeibordKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard/Sources
      - path: Shared
      - path: Keyboard/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Resources/Dictionaries
        type: folder
        buildPhase: resources
      - path: Resources/Emoji
        type: folder
        buildPhase: resources
    dependencies:
      - package: KeibordCore
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Keibord
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: de-AT
            RequestsOpenAccess: true
        KeibordAppGroup: group.$(KEIBORD_BUNDLE_ID)
    entitlements:
      path: Keyboard/KeibordKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.$(KEIBORD_BUNDLE_ID)]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(KEIBORD_BUNDLE_ID).keyboard
        PRODUCT_NAME: KeibordKeyboard
        APPLICATION_EXTENSION_API_ONLY: YES
